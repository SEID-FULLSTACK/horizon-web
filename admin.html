<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon Admin - New</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>

        body { background: #f4f7f6; font-family: sans-serif; }
        .login-container { height: 100vh; display: flex; align-items: center; justify-content: center; }
        #dashboard { display: none; padding: 20px;color: #FFB700; }
.dark-mode {
    background-color: #1a1a1a !important;
    color: #FFB700 !important;
}
.dark-mode .card, .dark-mode .table {
    background-color: #2d2d2d !important;
    color: #FFB700 !important;
    border-color: #444;
}
 @media (max-width: 768px) {
    /* በሞባይል ላይ የሰንጠረዡ ጽሑፍ ትንሽ እንዲል */
    .table {
        font-size: 12px;
    }
    
    /* ቁልፎቹ (Buttons) እንዳይጨናነቁ */
    .btn-sm {
        padding: 0.25rem 0.4rem;
        font-size: 10px;
    }

    /* ሰንጠረዡ በትንሹም ቢሆን እንዲተነፍስ */
    .table-responsive {
        border: 0;
    }
}
@media (max-width: 768px) {
    .table td, .table th {
        white-space: nowrap; /* ጽሑፉ ወደ ታች እንዳይወርድ ይከለክላል */
        padding: 8px 4px !important; /* ጠባብ ፓዲንግ */
        font-size: 11px; /* ትንሽ የጽሑፍ መጠን */
    }
}
    </style>
</head>
<body>

<div id="loginPage" class="login-container">
    <div class="card p-4 shadow" style="width: 350px;">
        <h4 class="text-center mb-4">Admin Login</h4>
        <input type="email" id="adminEmail" class="form-control mb-3" placeholder="Email">
        <input type="password" id="adminPass" class="form-control mb-3" placeholder="Password">
        <button class="btn btn-primary w-100" id="loginBtn" onclick="login()">Login</button>
    </div>
</div>

<div id="dashboard">
    <nav class="navbar navbar-dark bg-dark mb-4 px-3">
        <span class="navbar-brand">Horizon Web Tech Admin</span>
        <button class="btn btn-danger btn-sm" onclick="location.reload()">Logout</button>
    </nav>
<div class="form-check form-switch text-white">
    <input class="form-check-input" type="checkbox" id="darkModeToggle">
    <label class="form-check-label">Dark Mode</label>
</div>
<div class="card p-3 mb-4 shadow-sm">
    <h6>Upload New Project</h6>
    <div class="d-flex gap-2">
        <input type="text" id="projName" class="form-control" placeholder="Project Name">
        <input type="url" id="projLink" class="form-control" placeholder="GitHub/Live Link">
        <button class="btn btn-success" onclick="uploadProject()">Upload</button>
    </div>
</div>
  <div class="table-responsive">
    <table class="table table-hover mt-3">
        <thead class="table-light">
            <tr>
                <th>Transaction ID</th>
              <th>Client Email</th>
                <th>Service</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="orderTableBody">
            </tbody>
    </table>
</div> 
</div>


<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, getDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    const firebaseConfig = {
        apiKey: "AIzaSyDV-7voUWNUNN8Q7OXt0Ml4EwoL-z8qx0s",
        authDomain: "horizon-web-tech.firebaseapp.com",
databaseURL: "https://horizon-web-tech-default-rtdb.firebaseio.com/",
        projectId: "horizon-web-tech",
        storageBucket: "horizon-web-tech.firebasestorage.app",
        messagingSenderId: "472300718563",
        appId: "1:472300718563:web:66e0aa4250fac73e3678d6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // 2. Login Function
document.getElementById('loginBtn').addEventListener('click', async () => {
    const email = document.getElementById('adminEmail').value;
    const pass = document.getElementById('adminPass').value;

    try {
        // 1. መጀመሪያ በ Auth ማረጋገጥ
        const userCredential = await signInWithEmailAndPassword(auth, email, pass);
        const userEmail = userCredential.user.email;

        // 2. በ Firestore 'admins' ውስጥ መኖሩን ማረጋገጥ
        const adminDoc = await getDoc(doc(db, "admins", userEmail));

        if (adminDoc.exists() && adminDoc.data().role === "admin") {
            // አድሚን ከሆነ ብቻ ገጹን አሳይ
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            loadData(); 
        } else {
            // አድሚን ካልሆነ መልሰህ አስወጣው
            await auth.signOut();
            alert("ይቅርታ፣ ይህ ገጽ ለአስተዳዳሪዎች ብቻ የተፈቀደ ነው!");
        }
    } catch (err) {
        alert("ስህተት፡ " + err.message);
    }
});
    // 3. Update Status (Global ለማድረግ ለ window እንሰጠዋለን)
    window.updateStatus = async (id, newStatus) => {
        try {
            const orderRef = doc(db, "orders", id);
            await updateDoc(orderRef, { status: newStatus });
            alert("ሁኔታው ተቀይሯል!");
        } catch (err) {
            console.error("Update error:", err);
        }
    };


    // 4. Delete Order (Global ለማድረግ ለ window እንሰጠዋለን)
    window.deleteOrder = async (id) => {
        if (confirm("ይህንን ትዕዛዝ መሰረዝ ትፈልጋለህ?")) {
            try {
                await deleteDoc(doc(db, "orders", id));
                alert("ትዕዛዙ ተሰርዟል!");
            } catch (err) {
                console.error("Delete error:", err);
            }
        }
    };

    // 5. Load Data Function
    function loadData() {
        onSnapshot(collection(db, "orders"), (snapshot) => {
            const tableBody = document.getElementById('orderTableBody');
            tableBody.innerHTML = "";

            snapshot.forEach((doc) => {
                const data = doc.data();
                const row = `
                    <tr>
                        <td>#${data.transactionID || doc.id.substring(0,5)}</td>
                        <td>${data.email || 'No Email'}</td>
                        <td>${data.serviceType || 'General'}</td>
                        <td>
                            <select class="form-select form-select-sm" onchange="updateStatus('${doc.id}', this.value)">
                                <option value="Pending" ${data.status === 'Pending' ? 'selected' : ''}>Pending</option>
                                <option value="In Progress" ${data.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                                <option value="Completed" ${data.status === 'Completed' ? 'selected' : ''}>Completed</option>
                            </select>
                        </td>
                        <td>
                            <button class="btn btn-danger btn-sm" onclick="deleteOrder('${doc.id}')">Delete</button>
                        </td>
                    </tr>
                `;
                tableBody.insertAdjacentHTML('beforeend', row);
            });
        });
    }

document.getElementById('darkModeToggle').addEventListener('change', function() {
    document.body.classList.toggle('dark-mode');
});


</script>
</body>
</html>
