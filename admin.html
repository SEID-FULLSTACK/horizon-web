<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon Web Tech | Admin Central</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

    <style>
        :root {
            --primary: #0f172a;
            --accent: #3b82f6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --sidebar-w: 260px;
            --bg: #f1f5f9;
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; transition: all 0.2s; }
        body { background: var(--bg); color: #1e293b; overflow-x: hidden; }

        /* --- 1. LOGIN PAGE --- */
        #loginPage {
            display: flex; align-items: center; justify-content: center; height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }
        .login-card {
            background: white; padding: 2.5rem; border-radius: 16px; width: 100%; max-width: 400px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2);
        }
        .login-card h2 { margin-bottom: 1.5rem; text-align: center; font-weight: 700; color: var(--primary); }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: 0.85rem; margin-bottom: 5px; font-weight: 500; }
        input, select, textarea { 
            width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; outline: none;
        }
        input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px #3b82f633; }
        .login-footer { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; margin-top: 10px; }
        .btn-auth { 
            width: 100%; padding: 12px; background: var(--accent); color: white; border: none; 
            border-radius: 8px; font-weight: 600; margin-top: 20px; cursor: pointer;
        }
        .btn-auth:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4); }

        /* --- 2. ADMIN DASHBOARD LAYOUT --- */
        #dashboard { display: none; }
        .sidebar {
            width: var(--sidebar-w); background: var(--primary); color: white; height: 100vh;
            position: fixed; left: 0; top: 0; padding: 20px; z-index: 1000;
        }
        .sidebar-brand { font-size: 1.25rem; font-weight: 700; padding-bottom: 30px; border-bottom: 1px solid #334155; margin-bottom: 20px; }
        .nav-link { 
            display: flex; align-items: center; gap: 12px; padding: 12px; color: #94a3b8; 
            text-decoration: none; border-radius: 8px; margin-bottom: 4px; cursor: pointer;
        }
        .nav-link:hover, .nav-link.active { background: #1e293b; color: white; }
        .nav-link i { width: 20px; }

        .main-wrapper { margin-left: var(--sidebar-w); padding: 0; }
        .top-nav {
            background: white; height: 70px; display: flex; align-items: center; justify-content: flex-end;
            padding: 0 30px; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; }
        .content-area { padding: 30px; max-width: 1200px; margin: 0 auto; }

        /* --- 3. OVERVIEW CARDS --- */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; }
        .stat-card h4 { color: #64748b; font-size: 0.85rem; text-transform: uppercase; margin-bottom: 10px; }
        .stat-card .value { font-size: 1.75rem; font-weight: 700; }

        /* --- 4. TABLES & BADGES --- */
        .card { background: white; border-radius: 12px; border: 1px solid #e2e8f0; padding: 20px; margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px; background: #f8fafc; font-size: 0.85rem; color: #64748b; }
        td { padding: 15px; border-bottom: 1px solid #f1f5f9; font-size: 0.9rem; }
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; }
        .bg-pending { background: #fef3c7; color: #92400e; }
        .bg-progress { background: #dbeafe; color: #1e40af; }
        .bg-complete { background: #dcfce7; color: #166534; }

        /* --- 5. IMAGE PREVIEW --- */
        #imagePreview { width: 150px; height: 150px; object-fit: cover; border-radius: 8px; display: none; margin-top: 10px; border: 2px dashed #cbd5e1; }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .main-wrapper { margin-left: 0; }
        }
    </style>
</head>
<body>

<div id="loginPage">
    <div class="login-card">
        <h2>Horizon Admin</h2>
        <div class="form-group">
            <label>Admin Email</label>
            <input type="email" id="adminEmail" placeholder="admin@horizon.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="adminPass" placeholder="••••••••">
        </div>
        <div class="login-footer">
            <label><input type="checkbox"> Remember Me</label>
            <a href="#" style="color: var(--accent); text-decoration: none;">Forgot Password?</a>
        </div>
        <button class="btn-auth" onclick="login()">Login to Dashboard</button>
    </div>
</div>

<div id="dashboard">
    <div class="sidebar">
        <div class="sidebar-brand">HORIZON WEB</div>
        <div class="nav-link active" onclick="showSection('overview')"><i class="fas fa-home"></i> Overview</div>
        
        <p style="font-size: 0.7rem; color: #475569; margin: 20px 0 10px 10px; text-transform: uppercase;">Order Control</p>
        <div class="nav-link" onclick="loadOrders('Pending')"><i class="fas fa-clock"></i> Pending Orders</div>
        <div class="nav-link" onclick="loadOrders('In Progress')"><i class="fas fa-spinner"></i> In Progress</div>
        <div class="nav-link" onclick="loadOrders('Completed')"><i class="fas fa-check-circle"></i> Completed</div>

        <p style="font-size: 0.7rem; color: #475569; margin: 20px 0 10px 10px; text-transform: uppercase;">Management</p>
        <div class="nav-link" onclick="showSection('uploadProject')"><i class="fas fa-upload"></i> Upload Project</div>
        <div class="nav-link" onclick="showSection('postNews')"><i class="fas fa-newspaper"></i> Post News</div>
    </div>

    <div class="main-wrapper">
        <div class="top-nav">
            <div style="display:flex; align-items:center; gap:15px;">
                <span id="adminName" style="font-weight: 500;">Admin User</span>
                <button onclick="logout()" style="padding: 8px 15px; border-radius: 6px; border: 1px solid #e2e8f0; background: white; cursor: pointer;">Logout</button>
            </div>
        </div>

        <div class="content-area">
            <div id="section-overview" class="admin-section">
                <div class="stats-grid">
                    <div class="stat-card"><h4>Total</h4><div class="value" id="count-total">0</div></div>
                    <div class="stat-card"><h4>Pending</h4><div class="value" id="count-pending" style="color: var(--warning)">0</div></div>
                    <div class="stat-card"><h4>Active</h4><div class="value" id="count-progress" style="color: var(--accent)">0</div></div>
                    <div class="stat-card"><h4>Done</h4><div class="value" id="count-complete" style="color: var(--success)">0</div></div>
                </div>
            </div>

            <div id="section-orders" class="admin-section" style="display:none;">
                <div class="card">
                    <h2 id="orderTableTitle">Orders</h2>
                    <div style="overflow-x: auto;">
                        <table id="ordersTable">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Client</th>
                                    <th>Project</th>
                                    <th>Date</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="ordersBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div id="section-uploadProject" class="admin-section" style="display:none;">
                <div class="card" style="max-width: 600px;">
                    <h2>Upload New Project</h2>
                    <div class="form-group">
                        <label>Project Title</label>
                        <input type="text" id="pTitle">
                    </div>
                    <div class="form-group">
                        <label>Client Name</label>
                        <input type="text" id="pClient">
                    </div>
                    <div class="form-group">
                        <label>Project Image</label>
                        <input type="file" id="pImage" onchange="previewImage(event)">
                        <img id="imagePreview">
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select id="pCat">
                            <option>Web Development</option>
                            <option>UI/UX Design</option>
                            <option>E-Commerce</option>
                        </select>
                    </div>
                    <button class="btn-auth" onclick="handleProjectUpload()">Submit Project</button>
                </div>
            </div>

            <div id="section-postNews" class="admin-section" style="display:none;">
                <div class="card">
                    <h2>Post News Update</h2>
                    <input type="text" id="newsTitle" placeholder="News Title" style="margin-bottom: 20px;">
                    <div id="editor" style="height: 300px; margin-bottom: 20px;"></div>
                    <div style="display:flex; gap:10px;">
                        <button class="btn-auth" onclick="publishNews('Published')">Publish Now</button>
                        <button class="btn-auth" onclick="publishNews('Draft')" style="background: #64748b;">Save as Draft</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-app.js";
    import { getFirestore, collection, addDoc, doc, updateDoc, deleteDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-auth.js";

   const firebaseConfig = {
        apiKey: "AIzaSyDV-7voUWNUNN8Q7OXt0Ml4EwoL-z8qx0s",
        authDomain: "horizon-web-tech.firebaseapp.com",
        projectId: "horizon-web-tech",
        storageBucket: "horizon-web-tech.firebasestorage.app",
        messagingSenderId: "472300718563",
        appId: "1:472300718563:web:66e0aa4250fac73e3678d6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentUser = null;
    // --- NAVIGATION LOGIC ---
    window.showSection = (sectionId) => {
        document.querySelectorAll('.admin-section').forEach(s => s.style.display = 'none');
        document.getElementById(`section-${sectionId}`).style.display = 'block';
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
    };

    // --- AUTH LOGIC ---
    window.login = async () => {
        const e = document.getElementById("adminEmail").value;
        const p = document.getElementById("adminPass").value;
        try { await signInWithEmailAndPassword(auth, e, p); } catch(err) { Swal.fire('Error', err.message, 'error'); }
    };

    onAuthStateChanged(auth, (user) => {
        if(user) {
            document.getElementById("loginPage").style.display = "none";
            document.getElementById("dashboard").style.display = "block";
            loadOverview();
        }
    });

    window.logout = () => signOut(auth).then(() => location.reload());

    // --- ORDERS LOGIC ---
    window.loadOrders = (filterStatus) => {
        showSection('orders');
        document.getElementById("orderTableTitle").innerText = `${filterStatus} Orders`;
        
        onSnapshot(query(collection(db, "orders"), orderBy("createdAt", "desc")), (snap) => {
            const body = document.getElementById("ordersBody");
            body.innerHTML = "";
            snap.forEach(d => {
                const data = d.data();
                if(data.status === filterStatus) {
                    body.innerHTML += `
                    <tr>
                        <td>#${d.id.slice(0,5)}</td>
                        <td>${data.clientName}</td>
                        <td>${data.project}</td>
                        <td>${data.createdAt?.toDate().toLocaleDateString() || '...'}</td>
                        <td><span class="badge bg-${filterStatus.toLowerCase().replace(' ','')}">${data.status}</span></td>
                        <td>
                            <button onclick="changeStatus('${d.id}')" style="color:var(--accent); border:none; background:none; cursor:pointer;"><i class="fas fa-edit"></i></button>
                            <button onclick="confirmDelete('${d.id}')" style="color:var(--danger); border:none; background:none; cursor:pointer;"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>`;
                }
            });
        });
    };

    window.changeStatus = async (id) => {
        const { value: status } = await Swal.fire({
            title: 'Update Order Status',
            input: 'select',
            inputOptions: { 'Pending': 'Pending', 'In Progress': 'In Progress', 'Completed': 'Completed' },
            showCancelButton: true
        });
        if (status) {
            await updateDoc(doc(db, "orders", id), { status });
            Swal.fire('Updated!', `Order moved to ${status}`, 'success');
        }
    };

    window.confirmDelete = (id) => {
        Swal.fire({
            title: 'Are you sure?',
            text: "This order will be permanently deleted!",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#ef4444',
            confirmButtonText: 'Yes, delete it!'
        }).then(async (result) => {
            if (result.isConfirmed) {
                await deleteDoc(doc(db, "orders", id));
                Swal.fire('Deleted!', 'Order has been removed.', 'success');
            }
        });
    };

    // --- DASHBOARD STATS ---
    function loadOverview() {
        onSnapshot(collection(db, "orders"), (snap) => {
            let p=0, a=0, c=0;
            snap.forEach(d => {
                const s = d.data().status;
                if(s === 'Pending') p++;
                if(s === 'In Progress') a++;
                if(s === 'Completed') c++;
            });
            document.getElementById("count-total").innerText = snap.size;
            document.getElementById("count-pending").innerText = p;
            document.getElementById("count-progress").innerText = a;
            document.getElementById("count-complete").innerText = c;
        });
    }

    // --- UPLOAD LOGIC ---
    window.previewImage = (e) => {
        const preview = document.getElementById("imagePreview");
        preview.src = URL.createObjectURL(e.target.files[0]);
        preview.style.display = "block";
    };

    window.handleProjectUpload = async () => {
        // Here you would normally upload the image to Firebase Storage first
        Swal.fire('Success', 'Project uploaded successfully!', 'success');
    };

    window.publishNews = async (status) => {
        const title = document.getElementById("newsTitle").value;
        const content = quill.root.innerHTML;
        if(!title) return Swal.fire('Error', 'Title is required', 'error');
        
        await addDoc(collection(db, "news"), { title, content, status, createdAt: serverTimestamp() });
        Swal.fire('News ' + status, 'Article has been saved.', 'success');
    };
</script>
</body>
</html>
