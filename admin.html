<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon Web Tech Admin - ትዕዛዝ ማስተዳደሪያ</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #bd1084; color: white; padding: 20px; }
        .admin-container { max-width: 1000px; margin: auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid #333; padding-bottom: 10px; }
        h1 { color: #4facfe; }
        
        .order-card { background: #1e1e1e; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #333; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .order-info p { margin-bottom: 8px; font-size: 14px; color: #bbb; }
        .order-info strong { color: #fff; }
        
        .action-area { display: flex; flex-direction: column; gap: 10px; justify-content: center; align-items: flex-end; }
        .status-btn { padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 160px; transition: 0.3s; }
        
        .btn-progress { background: #4facfe; color: white; }
        .btn-complete { background: #2ecc71; color: white; }
        .btn-delete { background: #e74c3c; color: white; margin-top: 5px; font-size: 12px; width: 80px; padding: 5px; }
        
        .status-label { padding: 5px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .pending { background: #ffa500; color: #000; }
        .progress { background: #4facfe; color: #fff; }
        .completed { background: #2ecc71; color: #fff; }

        @media (max-width: 600px) { .order-card { grid-template-columns: 1fr; } .action-area { align-items: flex-start; } }
    </style>
</head>
<body>

    <div class="admin-container">
        <header>
            <h1>Admin Panel</h1>
            <button onclick="location.href='dashboard.html'" style="background:none; color:#4facfe; border:1px solid #4facfe; padding:5px 10px; cursor:pointer; border-radius:5px;">ወደ Dashboard ተመለስ</button>
        </header>

        <div id="admin-orders-list">
            <p>ትዕዛዞችን በማምጣት ላይ...</p>
        </div>
    </div>

    <script>
        // --- 1. Firebase Config (የራስህን እዚህ ተካ) ---
        const firebaseConfig = {
  apiKey: "AIzaSyDV-7voUWNUNN8Q7OXt0Ml4EwoL-z8qx0s",
  authDomain: "horizon-web-tech.firebaseapp.com",
  projectId: "horizon-web-tech",
  storageBucket: "horizon-web-tech.firebasestorage.app",
  messagingSenderId: "472300718563",
  appId: "1:472300718563:web:66e0aa4250fac73e3678d6",
  measurementId: "G-RX10LYT9W1"
};
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // --- 2. Admin Security (ኢሜይልህን እዚህ አስገባ) ---
        const ADMIN_EMAIL = "seidfirew2021@gmail.com"; // <--- ያንተን ኢሜይል እዚህ ተካው!

        auth.onAuthStateChanged(user => {
            if (!user || user.email !== ADMIN_EMAIL) {
                alert("ለዚህ ገጽ ፈቃድ የለዎትም!");
                window.location.href = "dashboard.html";
            } else {
                loadAllOrders();
            }
        });

        // --- 3. ሁሉንም ትዕዛዞች መጫን ---
        function loadAllOrders() {
            const list = document.getElementById('admin-orders-list');
            
            db.collection('orders').orderBy('timestamp', 'desc').onSnapshot(snap => {
                list.innerHTML = snap.empty ? "ምንም ትዕዛዝ አልተገኘም" : "";
                
                snap.forEach(doc => {
                    const data = doc.data();
                    const id = doc.id;
                    const status = data.status || "Pending";
                    
                    list.innerHTML += `
                        <div class="order-card">
                            <div class="order-info">
                                <p><strong>አገልግሎት:</strong> ${data.serviceType}</p>
                                <p><strong>ትራንዛክሽን ID:</strong> <span style="color:#2ecc71">${data.transactionID}</span></p>
                                <p><strong>ደባበኛ:</strong> ${data.email}</p>
                                <p><strong>ዝርዝር:</strong> ${data.description || 'የለም'}</p>
                                <p><strong>ሁኔታ:</strong> <span class="status-label ${status.toLowerCase()}">${status}</span></p>
                            </div>
                            <div class="action-area">
                                <button class="status-btn btn-progress" onclick="updateStatus('${id}', 'In Progress')">ወደ 'በሂደት' ቀይር</button>
                                <button class="status-btn btn-complete" onclick="updateStatus('${id}', 'Completed')">ወደ 'ተጠናቀቀ' ቀይር</button>
                                <button class="btn-delete" onclick="deleteOrder('${id}')">ሰርዝ</button>
                            </div>
                        </div>
                    `;
                });
            });
        }

        // --- 4. ሁኔታን መቀየር (Update Status) ---
        function updateStatus(orderId, newStatus) {
            db.collection('orders').doc(orderId).update({
                status: newStatus
            }).then(() => {
                console.log("Status updated!");
            }).catch(err => alert("ስህተት: " + err.message));
        }

        // --- 5. ትዕዛዝ መሰረዝ ---
        function deleteOrder(orderId) {
            if(confirm("ይህ ትዕዛዝ ይጥፋ?")) {
                db.collection('orders').doc(orderId).delete();
            }
        }
    </script>
</body>
</html>
