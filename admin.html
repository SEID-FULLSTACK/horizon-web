<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Horizon Tech</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: white; }
        .container { max-width: 800px; margin: auto; background: black;color: #FFD700; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 20px; cursor: pointer; border: none; border-radius: 5px; background-color: #FFD700; color: white; }
        button:hover { background-color: #0056b3; }
        #adminProjectList { margin-top: 30px; }
        .project-item { border-bottom: 1px solid #eee; padding: 15px 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>Admin Dashboard</h1>
 
    <div class="order-card" style="border: 1px solid #ddd; padding: 15px; margin: 10px; border-radius: 8px;">
        <p><strong>ደንበኛ፦</strong> ${order.customerName}</p>
        <p><strong>ትዕዛዝ፦</strong> ${order.serviceType}</p>
        <p><strong>አሁኑ ሁኔታ፦</strong> <span id="status-${doc.id}" style="color: blue; font-weight: bold;">${order.status || 'Pending'}</span></p>
        
        <select onchange="updateOrderStatus('${doc.id}', this.value)" style="padding: 5px; border-radius: 5px;">
            <option value="">ሁኔታውን ቀይር</option>
            <option value="Pending">Pending (በጥበቃ ላይ)</option>
            <option value="In Progress">In Progress (በዝግጅት ላይ)</option>
            <option value="Completed">Completed (ተጠናቋል)</option>
        </select>
        
        <button onclick="deleteOrder('${doc.id}')" style="background: red; color: white; margin-left: 10px;">ሰርዝ</button>
    </div>
`;
    <div class="upload-section">
        <h3>አዲስ ፕሮጀክት ጨምር</h3>
        <input type="text" id="projectTitle" placeholder="የፕሮጀክት ርዕስ (ለምሳሌ፦ Web Design)">
        
        <textarea id="projectDesc" rows="4" placeholder="ስለ ፕሮጀክቱ ጥቂት መግለጫ..."></textarea>
        
        <label for="projectImage">የፕሮጀክት ፎቶ ምረጥ፦</label>
        <input type="file" id="projectImage" accept="image/*">
        
        <button onclick="uploadProject()">ፕሮጀክቱን ጫን</button>
    </div>

    <hr>

    <h3>የተጫኑ ፕሮጀክቶች</h3>
    <div id="adminProjectList">
        </div>
</div>

<script type="module" src="admin.js"></script>

</body>
</html>
