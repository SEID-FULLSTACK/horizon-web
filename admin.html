<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon Web Tech | SaaS Dashboard</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

    <style>
        :root {
            --primary: #0f172a;
            --accent: #3b82f6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --sidebar-w: 260px;
            --bg: #f1f5f9;
            --white: #ffffff;
        }

        .dark-mode {
            --primary: #1e293b;
            --bg: #0f172a;
            --white: #1e293b;
            --text: #f1f5f9;
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; transition: all 0.2s; }
        body { background: var(--bg); color: #1e293b; overflow-x: hidden; }

        /* --- LOGIN PAGE --- */
        #loginPage {
            display: flex; align-items: center; justify-content: center; height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }
        .login-card {
            background: white; padding: 2.5rem; border-radius: 16px; width: 90%; max-width: 400px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2);
        }

        /* --- DASHBOARD LAYOUT --- */
        #dashboard { display: none; }
        
        .sidebar {
            width: var(--sidebar-w); background: var(--primary); color: white; height: 100vh;
            position: fixed; left: 0; top: 0; padding: 20px; z-index: 1000;
            transform: translateX(0);
        }
        
        .main-wrapper { margin-left: var(--sidebar-w); min-height: 100vh; }

        .top-nav {
            background: white; height: 70px; display: flex; align-items: center; 
            justify-content: space-between; padding: 0 30px; border-bottom: 1px solid #e2e8f0;
        }

        /* --- MOBILE RESPONSIVENESS --- */
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); width: 280px; }
            .sidebar.active { transform: translateX(0); }
            .main-wrapper { margin-left: 0; }
            .mobile-toggle { display: block !important; }
        }

        /* --- COMPONENTS --- */
        .card { background: white; border-radius: 12px; border: 1px solid #e2e8f0; padding: 20px; margin-bottom: 20px; }
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #e2e8f0; border-radius: 8px; }
        .btn-main { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; }

        .badge { padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; }
        .bg-pending { background: #fef3c7; color: #92400e; }
        .bg-inprogress { background: #dbeafe; color: #1e40af; }
        .bg-completed { background: #dcfce7; color: #166534; }

        #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 950; }
        #overlay.active { display: block; }
    </style>
</head>
<body>

<div id="overlay" onclick="toggleMenu()"></div>

<div id="loginPage">
    <div class="login-card">
        <h2 style="text-align: center; margin-bottom: 20px;">Horizon Admin</h2>
        <input type="email" id="loginEmail" placeholder="Email">
        <input type="password" id="loginPass" placeholder="Password">
        <button class="btn-main" onclick="login()">Login to Dashboard</button>
    </div>
</div>

<div id="dashboard">
    <div class="sidebar" id="sidebar">
        <h2 style="margin-bottom: 30px;">HORIZON WEB TECH</h2>
        <div style="cursor: pointer; padding: 10px;" onclick="showSection('overview')"><i class="fas fa-chart-pie"></i> Overview</div>
        
        <p style="font-size: 0.7rem; color: #64748b; margin: 20px 0 10px;">ORDER CONTROL</p>
        <div style="cursor: pointer; padding: 10px;" onclick="loadOrderTable('Pending')"><i class="fas fa-clock"></i> Pending</div>
        <div style="cursor: pointer; padding: 10px;" onclick="loadOrderTable('In Progress')"><i class="fas fa-spinner"></i> In Progress</div>
        <div style="cursor: pointer; padding: 10px;" onclick="loadOrderTable('Completed')"><i class="fas fa-check-double"></i> Completed</div>
        
        <p style="font-size: 0.7rem; color: #64748b; margin: 20px 0 10px;">MANAGEMENT</p>
        <div style="cursor: pointer; padding: 10px;" onclick="showSection('upload')"><i class="fas fa-plus"></i> Upload Project</div>
        
        <button onclick="logout()" style="margin-top: 50px; background: none; border: 1px solid #444; color: white; width: 100%; padding: 10px; border-radius: 5px; cursor: pointer;">Logout</button>
    </div>

    <div class="main-wrapper">
        <div class="top-nav">
            <button class="mobile-toggle" onclick="toggleMenu()" style="display:none; background:none; border:none; font-size: 1.5rem;"><i class="fas fa-bars"></i></button>
            <span id="userDisplay">Welcome, Admin</span>
            <button onclick="toggleDark()" style="background:none; border:none; cursor:pointer;"><i class="fas fa-moon"></i></button>
        </div>

        <div class="content-area" style="padding: 30px;">
            
            <div id="section-overview" class="admin-section">
                <div class="stats-grid">
                    <div class="stat-card"><h4>Total Orders</h4><div class="value" id="stat-total">0</div></div>
                    <div class="stat-card"><h4>Pending</h4><div class="value" id="stat-pending">0</div></div>
                    <div class="stat-card"><h4>In Progress</h4><div class="value" id="stat-progress">0</div></div>
                </div>

                <div id="customer-only-form" class="card">
                    <h3>Place New Order</h3>
                    <input type="text" id="orderProjectName" placeholder="Project Name">
                    <select id="orderType">
                        <option value="Web Development">Web Development</option>
                        <option value="App Design">App Design</option>
                    </select>
                    <textarea id="orderDescription" placeholder="Project details..."></textarea>
                    <button onclick="submitOrder()" class="btn-main">Submit Order</button>
                </div>
            </div>

            <div id="section-orders" class="admin-section" style="display:none;">
                <div class="card">
                    <h2 id="tableTitle" style="margin-bottom: 20px;">Orders</h2>
                    <table style="width: 100%; border-collapse: collapse;">
                        <thead>
                            <tr style="text-align: left; border-bottom: 2px solid #eee;">
                                <th>Project</th>
                                <th>Client</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="ordersBody"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-app.js";
    import { getFirestore, collection, addDoc, doc, updateDoc, deleteDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-auth.js";

    const firebaseConfig = {
       apiKey: "AIzaSyDV-7voUWNUNN8Q7OXt0Ml4EwoL-z8qx0s",
        authDomain: "horizon-web-tech.firebaseapp.com",
        projectId: "horizon-web-tech",
        storageBucket: "horizon-web-tech.firebasestorage.app",
        messagingSenderId: "472300718563",
        appId: "1:472300718563:web:66e0aa4250fac73e3678d6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentUser = null;

    // --- NAVIGATION ---
    window.toggleMenu = () => {
        document.getElementById("sidebar").classList.toggle("active");
        document.getElementById("overlay").classList.toggle("active");
    };

    window.showSection = (id) => {
        document.querySelectorAll('.admin-section').forEach(s => s.style.display = 'none');
        document.getElementById(`section-${id}`).style.display = 'block';
    };

    // --- AUTH ---
    window.login = async () => {
        const e = document.getElementById("loginEmail").value;
        const p = document.getElementById("loginPass").value;
        try { await signInWithEmailAndPassword(auth, e, p); } catch(err) { Swal.fire('Error', err.message, 'error'); }
    };

    onAuthStateChanged(auth, (user) => {
        if(user) {
            currentUser = user;
            document.getElementById("loginPage").style.display = "none";
            document.getElementById("dashboard").style.display = "block";
            document.getElementById("userDisplay").innerText = user.email;
            initDashboard();
        }
    });

    window.logout = () => signOut(auth).then(() => location.reload());

    // --- ORDER SUBMISSION (THE FIX) ---
    window.submitOrder = async () => {
        const project = document.getElementById("orderProjectName").value;
        const type = document.getElementById("orderType").value;
        const desc = document.getElementById("orderDescription").value;

        if(!project || !desc) return Swal.fire('Wait!', 'Fill in all fields', 'warning');

        try {
            await addDoc(collection(db, "orders"), {
                clientId: currentUser.uid,
                clientName: currentUser.email,
                project: project,
                type: type,
                description: desc,
                status: "Pending",
                createdAt: serverTimestamp()
            });
            Swal.fire('Success', 'Order created!', 'success');
            document.getElementById("orderProjectName").value = "";
            document.getElementById("orderDescription").value = "";
        } catch (e) {
            Swal.fire('Error', e.message, 'error');
        }
    };

    // --- DATA LOADING ---
    function initDashboard() {
        onSnapshot(collection(db, "orders"), (snap) => {
            let p=0, ip=0;
            snap.forEach(d => {
                if(d.data().status === 'Pending') p++;
                if(d.data().status === 'In Progress') ip++;
            });
            document.getElementById("stat-total").innerText = snap.size;
            document.getElementById("stat-pending").innerText = p;
            document.getElementById("stat-progress").innerText = ip;
        });
    }

    window.loadOrderTable = (statusFilter) => {
        showSection('orders');
        document.getElementById("tableTitle").innerText = statusFilter + " Orders";
        
        onSnapshot(query(collection(db, "orders"), orderBy("createdAt", "desc")), (snap) => {
            const body = document.getElementById("ordersBody");
            body.innerHTML = "";
            snap.forEach(d => {
                const data = d.data();
                if(data.status === statusFilter) {
                    body.innerHTML += `
                    <tr>
                        <td>${data.project}</td>
                        <td>${data.clientName}</td>
                        <td><span class="badge bg-${data.status.toLowerCase().replace(' ','')}">${data.status}</span></td>
                        <td>
                            <button onclick="updateStatus('${d.id}')" style="border:none; color:blue; background:none; cursor:pointer;"><i class="fas fa-edit"></i></button>
                            <button onclick="deleteOrder('${d.id}')" style="border:none; color:red; background:none; cursor:pointer;"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>`;
                }
            });
        });
    };

    window.updateStatus = async (id) => {
        const { value: status } = await Swal.fire({
            title: 'Update Status',
            input: 'select',
            inputOptions: { 'Pending':'Pending', 'In Progress':'In Progress', 'Completed':'Completed' }
        });
        if(status) await updateDoc(doc(db, "orders", id), { status });
    };

    window.deleteOrder = (id) => {
        Swal.fire({
            title: 'Are you sure?',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: 'Yes, delete it!'
        }).then(async (res) => {
            if(res.isConfirmed) await deleteDoc(doc(db, "orders", id));
        });
    };

</script>
</body>
</html>
